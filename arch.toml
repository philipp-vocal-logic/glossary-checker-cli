[[rules]]
files = ["src/**/*.py"]
forbid = [
    "^\\s*(from|import)\\s+(pytest|tests|subprocess|ast)\\b",
    "^\\s*from\\s+\\.",
    "^\\s*from\\s+glossary_checker_cli\\s+import\\b",
]
fix = "Use absolute submodule imports (glossary_checker_cli.<module>) and keep src free of test, AST, or subprocess dependencies."

[[rules]]
files = ["src/glossary_checker_cli/core.py"]
max_lines = 350
forbid = [
    "^\\s*(from|import)\\s+glossary_checker_cli\\.(checker|cli)\\b",
    "^\\s*(from|import)\\s+(os|sys|argparse|pathspec)\\b",
    "\\bprint\\s*\\(",
]
fix = "Keep core.py focused on glossary models, TOML loading, and validation: no imports from checker/cli, no pathspec/os/sys/argparse, and no print calls."

[[rules]]
files = ["src/glossary_checker_cli/checker.py"]
max_lines = 280
forbid = [
    "^\\s*(from|import)\\s+glossary_checker_cli\\.cli\\b",
    "^\\s*(from|import)\\s+(sys|argparse|tomllib)\\b",
    "\\bprint\\s*\\(",
]
fix = "Import direction is cli -> checker -> core. Keep CLI, TOML loading, and stdout/stderr printing out of checker.py."

[[rules]]
files = ["src/glossary_checker_cli/cli.py"]
max_lines = 80
forbid = [
    "^\\s*(from|import)\\s+(os|pathspec|re|difflib)\\b",
]
fix = "Keep cli.py as a thin entrypoint that delegates all checking and file discovery to checker.py and core.py."

[[rules]]
files = ["tests/**/*.py"]
max_lines = 350
fix = "Keep test modules concise and split large test suites by layer."
